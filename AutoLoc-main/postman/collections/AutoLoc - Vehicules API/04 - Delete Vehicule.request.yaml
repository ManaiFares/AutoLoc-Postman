$kind: http-request
name: 'Delete Vehicule'
order: 4000
method: DELETE
url: '{{base_url}}/vehicules/deleteVehicule/{{vehicule_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response body is empty (void method)", function () {
          pm.expect(pm.response.text()).to.eql("");
      });
